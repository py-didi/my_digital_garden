name: Build in GitHub Actions and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Поднимаем Python прямо в облаке GitHub
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Собираем весь сайт
      - name: Build Site
        run: |
          pip install -r requirements.txt
          python3 build.py

      # 4. Закидываем готовый HTML/CSS на твой VPS
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: "/var/www/my_digital_garden"
          strip_prefix: "dist"