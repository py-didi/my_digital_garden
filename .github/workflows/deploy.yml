name: Auto Deploy to VPS

on:
  push:
    branches:
      - main  # Если твоя главная ветка называется master, укажи master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            git config --global --add safe.directory /var/www/my_digital_garden
            cd /var/www/my_digital_garden
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}