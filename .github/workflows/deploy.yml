name: Deploy Main Site and Styled Quartz Garden

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем репозиторий
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Поднимаем Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Собираем Quartz с НАШИМИ стилями
      - name: Build Quartz
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git /tmp/quartz
          
          # Копируем заметки
          cp -r content/* /tmp/quartz/content/
          
          # Копируем НАШИ кастомные стили поверх дефолтных
          cp custom.scss /tmp/quartz/quartz/styles/custom.scss 2>/dev/null || true

          cd /tmp/quartz
          npm install
          npx quartz build

          # Готовим итоговую папку для выгрузки
          mkdir -p $GITHUB_WORKSPACE/dist/garden
          cp $GITHUB_WORKSPACE/index.html $GITHUB_WORKSPACE/script.js $GITHUB_WORKSPACE/style.css $GITHUB_WORKSPACE/dist/ 2>/dev/null || true
          cp -r /tmp/quartz/public/* $GITHUB_WORKSPACE/dist/garden/

      # 4. Выгружаем на VPS
      - name: Copy built files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: "/var/www/my_digital_garden"
          strip_components: 1