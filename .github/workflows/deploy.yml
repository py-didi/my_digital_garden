name: Build and Deploy Digital Garden

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код из GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Настраиваем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Собираем заметки из Обсидиана в HTML-папку garden
      - name: Build Garden HTML
        run: |
          pip install -r requirements.txt
          python build.py

      # 4. Копируем сайт и папку garden на VPS
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "index.html,style.css,script.js,garden"
          target: "/var/www/my_digital_garden"