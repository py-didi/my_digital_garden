name: Auto Deploy Custom SSG to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # 1. ПРОВЕРЯЕМ И ОБНОВЛЯЕМ ИСХОДНИКИ
            git config --global --add safe.directory /var/www/my_digital_garden

            if [ ! -d "/var/www/my_digital_garden/.git" ]; then
              echo "Папка не является git-репозиторием. Инициализируем..."
              rm -rf /var/www/my_digital_garden
              git clone https://github.com/py-didi/my_digital_garden.git /var/www/my_digital_garden
              cd /var/www/my_digital_garden
            else
              cd /var/www/my_digital_garden
              git fetch --all
              git reset --hard origin/main
            fi

            # 2. УСТАНАВЛИВАЕМ ЗАВИСИМОСТИ И СОБИРАЕМ САД
            python3 -m pip install -r requirements.txt --break-system-packages || python3 -m pip install -r requirements.txt
            python3 build.py

            # 3. ПУБЛИКУЕМ САД В /garden/
            mkdir -p /var/www/my_digital_garden/garden
            rm -rf /var/www/my_digital_garden/garden/*
            cp -r /var/www/my_digital_garden/dist/garden/. /var/www/my_digital_garden/garden/

            # 4. ЧИСТКА ВРЕМЕННОЙ СБОРКИ
            rm -rf /var/www/my_digital_garden/dist

            echo "=== ВСЁ СТИЛЬНО И ЧИСТО ЗАДЕПЛОЕНО ==="