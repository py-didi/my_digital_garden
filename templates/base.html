<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — The Antresoli's Digital Garden</title>
    <link rel="stylesheet" href="/garden/static/garden.css">
</head>

<body>
    <canvas id="space-canvas"></canvas>

    <div class="layout">
        <header class="header">
            <!-- Логотип -->
            <a href="https://theantresoli.ru" class="logo-link">
                <img src="/garden/static/logo.png" alt="Logo" class="pixel-logo">
            </a>

            <!-- Боковое меню навигации -->
            <nav class="sidebar-nav">
                <div class="nav-title">// Заметки</div>
                <ul>
                    {% for post in posts %}
                    <li>
                        <a href="{{ post.url }}" class="nav-link {% if post.url == current_url %}active{% endif %}">
                            {{ post.title }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </nav>
        </header>

        <!-- Контент текущей заметки -->
        <main class="content">
            {{ content | safe }}
        </main>
    </div>

    <script src="/script.js"></script>
</body>

</html>
